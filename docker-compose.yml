services:
  monitor-impressoras:
    image: sistemas-impressoras
    build: .
    container_name: monitor-impressoras
    ports:
      - "8080:8080"
    environment:
      TZ: "America/Fortaleza"
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      HISTORICO_FECHAMENTO_DIARIO: "${HISTORICO_FECHAMENTO_DIARIO:-23:59}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      API_USER: "${API_USER:-}"
      API_PASSWORD: "${API_PASSWORD:-}"
      MARIADB_HOST: "${MARIADB_HOST:-localhost}"
      MARIADB_PORT: "${MARIADB_PORT:-3306}"
      MARIADB_USER: "${MARIADB_USER:-MonitorUser}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-}"
      NETWORK_MARIADB_HOST: "${NETWORK_MARIADB_HOST:-}"
      NETWORK_MARIADB_PORT: "${NETWORK_MARIADB_PORT:-}"
      NETWORK_MARIADB_USER: "${NETWORK_MARIADB_USER:-}"
      NETWORK_MARIADB_PASSWORD: "${NETWORK_MARIADB_PASSWORD:-}"
      NETWORK_MARIADB_DATABASE: "${NETWORK_MARIADB_DATABASE:-}"
      NETWORK_MONITOR_INTERVAL_SECONDS: "${NETWORK_MONITOR_INTERVAL_SECONDS:-5}"
      NETWORK_PING_COUNT: "${NETWORK_PING_COUNT:-4}"
      NETWORK_PING_TIMEOUT_MS: "${NETWORK_PING_TIMEOUT_MS:-1000}"
      NETWORK_SNMP_INTERVAL_SECONDS: "${NETWORK_SNMP_INTERVAL_SECONDS:-60}"
      NETWORK_STABILITY_WINDOW: "${NETWORK_STABILITY_WINDOW:-20}"
      NETWORK_MAX_ENTRIES: "${NETWORK_MAX_ENTRIES:-1000}"
      NETWORK_PING_CONCURRENCY: "${NETWORK_PING_CONCURRENCY:-8}"
      NETWORK_HISTORY_RETENTION_DAYS: "${NETWORK_HISTORY_RETENTION_DAYS:-1}"
      NETWORK_HISTORY_PRUNE_INTERVAL_SECONDS: "${NETWORK_HISTORY_PRUNE_INTERVAL_SECONDS:-3600}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
      SMTP_TIMEOUT_SECONDS: "${SMTP_TIMEOUT_SECONDS:-10}"
      NOTIFICATION_TIMEZONE: "${NOTIFICATION_TIMEZONE:-America/Fortaleza}"
      NOTIFICATION_OUTAGE_MINUTES: "${NOTIFICATION_OUTAGE_MINUTES:-30}"
    restart: unless-stopped
